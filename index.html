    /**
     * ============================================================================
     * 2. STATE MANAGEMENT & PERSISTENCE
     * ============================================================================
     */
    const STORAGE_KEY = 'apotheosis_state_v3';

    const defaultState = {
      activeView: 'sanctuary',
      activeModuleFilter: 'all',
      activePillarTypeFilter: 'all', // all | practice | interview-concept
      activeProjectFilter: 'all',
      activeDsaCategory: 'all',
      activeDsaStatusFilter: 'all',
      hideCompleted: false,
      searchQuery: '',
      defaultLanguage: 'TypeScript',
      theme: 'light',
      selectedItem: { kind: 'item', id: 'mod-1-prac-1' }, // Persistent desktop inspector selection
      focusedIndex: 0,
      items: {},
      dsaProblems: {}
    };

    let appState = loadState();
    let activeDrawerItem = null;

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('apotheosis_state_v2');
        if (!raw) return structuredClone(defaultState);
        const parsed = JSON.parse(raw);
        return { ...structuredClone(defaultState), ...parsed };
      } catch (e) {
        return structuredClone(defaultState);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {
        showToast('Storage quota exceeded — progress kept in session.', 'warning');
      }
      updateGlobalTelemetry();
    }

    function getItemProgress(id) {
      return appState.items[id] || { completed: false, completedAt: null, notes: '' };
    }

    function getDsaProgress(id) {
      return appState.dsaProblems[id] || {
        status: 'todo',
        completedAt: null,
        attempts: 0,
        solutionLanguage: appState.defaultLanguage,
        timeComplexity: '',
        spaceComplexity: '',
        notes: ''
      };
    }

    /**
     * ============================================================================
     * 3. TELEMETRY & RANKING ENGINE
     * ============================================================================
     */
    function computeTelemetry() {
      let syllabusTotal = 0;
      let syllabusDone = 0;
      let practiceRem = 0;

      CURRICULUM_DATA.syllabus.forEach(mod => {
        mod.practice.forEach(p => {
          syllabusTotal++;
          if (getItemProgress(p.id).completed) syllabusDone++;
          else practiceRem++;
        });
        mod.interviewConcepts.forEach(c => {
          syllabusTotal++;
          if (getItemProgress(c.id).completed) syllabusDone++;
        });
      });

      const projectsTotal = CURRICULUM_DATA.projects.length;
      let projectsDone = 0;
      let flagshipRem = 0;
      CURRICULUM_DATA.projects.forEach(proj => {
        if (getItemProgress(proj.id).completed) projectsDone++;
        else if (proj.isFlagship) flagshipRem++;
      });

      const dsaTotal = CURRICULUM_DATA.dsa.problems.length;
      let dsaSolved = 0;
      let dsaInProgress = 0;
      CURRICULUM_DATA.dsa.problems.forEach(prob => {
        const st = getDsaProgress(prob.id).status;
        if (st === 'solved') dsaSolved++;
        else if (st === 'in-progress') dsaInProgress++;
      });

      const totalTrials = syllabusTotal + projectsTotal + dsaTotal; // 108
      const completedTrials = syllabusDone + projectsDone + dsaSolved;
      const pct = totalTrials > 0 ? Math.round((completedTrials / totalTrials) * 100) : 0;

      let rank = { roman: 'L1', title: 'Foundations', subtitle: 'HTML, CSS & Core JS' };
      if (pct >= 100) rank = { roman: 'L6', title: 'Apotheosis', subtitle: 'Senior Frontend Ready' };
      else if (pct >= 75) rank = { roman: 'L5', title: 'Production Ready', subtitle: 'Flagship Projects & Scale' };
      else if (pct >= 50) rank = { roman: 'L4', title: 'System Builder', subtitle: 'React & State Architecture' };
      else if (pct >= 25) rank = { roman: 'L3', title: 'Core Engineer', subtitle: 'JS Internals & TypeScript' };
      else if (pct >= 10) rank = { roman: 'L2', title: 'Apprentice', subtitle: 'Responsive UI & DOM' };

      return {
        syllabusTotal, syllabusDone, practiceRem,
        projectsTotal, projectsDone, flagshipRem,
        dsaTotal, dsaSolved, dsaInProgress,
        totalTrials, completedTrials, pct, rank
      };
    }

    function updateGlobalTelemetry() {
      const t = computeTelemetry();
      document.getElementById('nav-overall-pct').textContent = `${t.pct}%`;
      document.getElementById('nav-syllabus-count').textContent = `${t.syllabusDone}/${t.syllabusTotal}`;
      document.getElementById('nav-projects-count').textContent = `${t.projectsDone}/${t.projectsTotal}`;
      document.getElementById('nav-dsa-count').textContent = `${t.dsaSolved}/${t.dsaTotal}`;

      document.getElementById('topbar-pct').textContent = `${t.pct}%`;
      document.getElementById('topbar-trials').textContent = `${t.completedTrials}/${t.totalTrials}`;

      document.getElementById('shortcut-practice-rem').textContent = t.practiceRem;
      document.getElementById('shortcut-flagship-rem').textContent = t.flagshipRem;

      document.getElementById('sidebar-rank-roman').textContent = t.rank.roman;
      document.getElementById('sidebar-rank-title').textContent = t.rank.title;
      document.getElementById('sidebar-progress-bar').style.width = `${t.pct}%`;
      document.getElementById('sidebar-xp-text').textContent = `${t.completedTrials}/${t.totalTrials}`;
    }

    /**

    function showToast(message, type = 'gold') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const accent = type === 'success'
        ? 'border-olympus-laurel text-olympus-laurel dark:text-emerald-300'
        : 'border-olympus-gold text-stone-900 dark:text-stone-100';

      toast.className = `pointer-events-auto flex items-center gap-2.5 px-3.5 py-2 rounded-lg bg-marble-50 dark:bg-marble-900 border ${accent} shadow-md text-xs font-medium max-w-xs`;
      toast.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-olympus-gold shrink-0"></span><span>${escapeHtml(message)}</span>`;
      container.appendChild(toast);

      gsap.fromTo(toast, { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.2, ease: 'power2.out' });
      setTimeout(() => {
        gsap.to(toast, { opacity: 0, y: 6, duration: 0.18, onComplete: () => toast.remove() });
      }, 2200);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function applyTheme(theme) {
      const root = document.documentElement;
      if (theme === 'dark') root.classList.add('dark');
      else root.classList.remove('dark');
      appState.theme = theme;
      saveState();
    }

      appState.activeView = viewName;

        btn.className = isActive
          ? 'nav-btn w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-semibold transition-all bg-olympus-gold/15 text-olympus-goldDark dark:text-olympus-goldLight'

      });

      document.querySelectorAll('.mobile-nav-btn').forEach(btn => {

        btn.className = isActive
          ? 'mobile-nav-btn flex flex-col items-center gap-0.5 py-1 px-3 rounded-lg text-olympus-goldDark dark:text-olympus-goldLight font-semibold'

      renderCurrentView();

        updateHideCompletedBtn();
        switchView('pillars');

                    <div class="text-xs font-semibold text-slate-900 dark:text-slate-100 truncate mb-2">${escapeHtml(mod.title)}</div>

                    </div>

                `;

            </div>
          </section>
        </div>
      `;
    }

    /**
     * ----------------------------------------------------------------------------
     * VIEW B: SYLLABUS MODULES (High-Density Scannable Checklist + Bulk Action)
     * ----------------------------------------------------------------------------
     */
    function renderPillarsView() {
      const filterMod = appState.activeModuleFilter;
      const typeFilter = appState.activePillarTypeFilter;
      const modulesToRender = filterMod === 'all'
        ? CURRICULUM_DATA.syllabus

        <div class="space-y-4">

              </button>
              ${CURRICULUM_DATA.syllabus.map(mod => `

              <button onclick="setPillarTypeFilter('interview-concept')" class="px-2.5 py-1 rounded-md text-[11px] font-semibold ${typeFilter === 'interview-concept' ? 'bg-white dark:bg-slate-800 text-olympus-goldDark dark:text-amber-400 shadow-2xs' : 'text-slate-500'}">Concepts (27)</button>

    function renderCompactChecklistRow(item, rowIndex) {
      const prog = getItemProgress(item.id);
      const hasNotes = prog.notes && prog.notes.trim().length > 0;
      const isSelected = appState.selectedItem?.id === item.id;
      const isFocused = appState.focusedIndex === rowIndex;
      const isPractice = item.type === 'practice';

      return `
        <div
          data-nav-row="${rowIndex}"
          data-item-kind="item"
          data-item-id="${item.id}"
          onclick="selectInspectorItem('item', '${item.id}', ${rowIndex})"
          class="cursor-pointer px-4 py-2.5 flex items-start gap-3 transition-colors ${isSelected ? 'bg-olympus-gold/10 dark:bg-olympus-gold/15' : 'hover:bg-marble-50 dark:hover:bg-stone-800/40'} ${isFocused ? 'ring-1 ring-inset ring-olympus-gold/60' : ''}">
          
          <button
            onclick="event.stopPropagation(); toggleItemCompletion('${item.id}')"
            aria-label="Toggle completion"
            class="mt-0.5 w-4 h-4 rounded border flex items-center justify-center shrink-0 transition-all ${prog.completed
              ? 'bg-olympus-laurel border-olympus-laurel text-white'
              : 'border-stone-300 dark:border-stone-600 hover:border-olympus-gold bg-white dark:bg-stone-900'}">
            ${prog.completed ? '<svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>' : ''}
          </button>

          <div class="flex-1 min-w-0 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
            <div class="min-w-0">
              <div class="flex items-center gap-2">
                <span class="shrink-0 text-[10px] font-mono uppercase px-1.5 py-0.2 rounded ${isPractice
                  ? 'bg-olympus-aegean/10 text-olympus-aegean dark:text-olympus-aegeanLight'
                  : 'bg-olympus-terracotta/10 text-olympus-terracotta dark:text-amber-400'}">
                  ${isPractice ? 'PRAC' : 'CONCEPT'}
                </span>
                <p class="text-xs sm:text-sm leading-snug ${prog.completed ? 'line-through text-stone-400 dark:text-stone-500' : 'text-stone-800 dark:text-stone-200'}">
                  ${escapeHtml(item.text)}
                </p>
              </div>
            </div>

            <div class="flex items-center gap-1.5 shrink-0 pl-6 sm:pl-0">
              ${item.tags.slice(0, 2).map(t => `<span class="hidden md:inline-block text-[10px] font-mono px-1.5 py-0.5 rounded bg-stone-100 dark:bg-stone-800 text-stone-500">${escapeHtml(t)}</span>`).join('')}
              <span class="text-[11px] font-mono px-1.5 py-0.5 rounded ${hasNotes ? 'bg-olympus-gold/20 text-olympus-goldDark dark:text-olympus-goldLight font-semibold' : 'text-stone-400'}">
                ${hasNotes ? '✎' : '+'}
              </span>
            </div>
          </div>
        </div>
      `;
    }

    /**

      const catFilter = appState.activeDsaCategory;
      const statusFilter = appState.activeDsaStatusFilter;

      let problems = CURRICULUM_DATA.dsa.problems;
      if (catFilter !== 'all') problems = problems.filter(p => p.categoryId === catFilter);
      if (statusFilter === 'relevance') problems = problems.filter(p => Boolean(p.frontendRelevance));
      else if (statusFilter !== 'all') problems = problems.filter(p => getDsaProgress(p.id).status === statusFilter);
      if (appState.hideCompleted) problems = problems.filter(p => getDsaProgress(p.id).status !== 'solved');

      return `
        <div class="space-y-3">
          <!-- Compact Filter Toolbar -->
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
              <button onclick="setDsaCategory('all')" class="shrink-0 px-2.5 py-1.5 rounded-lg text-xs font-semibold ${catFilter === 'all' ? 'bg-olympus-gold text-white' : 'bg-white dark:bg-marble-900 text-stone-600 dark:text-stone-300 border border-stone-200 dark:border-stone-800'}">
                All (50)

              ${CURRICULUM_DATA.dsa.categories.map(cat => {
                const catProbs = CURRICULUM_DATA.dsa.problems.filter(p => p.categoryId === cat.id);

                return `
                  <button onclick="setDsaCategory('${cat.id}')" class="shrink-0 px-2.5 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 ${catFilter === cat.id ? 'bg-olympus-gold text-white' : 'bg-white dark:bg-marble-900 text-stone-600 dark:text-stone-300 border border-stone-200 dark:border-stone-800'}">
                    <span>${cat.code}. ${escapeHtml(cat.title.split(',')[0].split('—')[0].trim())}</span>

              ${[
                { id: 'all', label: 'All' },
                { id: 'relevance', label: '★ FE' },
                { id: 'todo', label: 'Todo' },
                { id: 'in-progress', label: 'Active' },
                { id: 'solved', label: 'Solved' }
              ].map(st => `
                <button onclick="setDsaStatusFilter('${st.id}')" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold ${statusFilter === st.id ? 'bg-stone-900 dark:bg-olympus-gold text-white' : 'bg-white dark:bg-marble-900 text-stone-600 dark:text-stone-300 border border-stone-200 dark:border-stone-800'}">
                  ${st.label}
                </button>
              `).join('')}
            </div>
          </div>

          <!-- Dense Data Table -->
          <div class="gsap-card rounded-2xl bg-white dark:bg-marble-900 border border-stone-200 dark:border-stone-800 overflow-hidden shadow-temple dark:shadow-temple-dark">
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="border-b border-stone-200 dark:border-stone-800 bg-marble-100/70 dark:bg-stone-900/80 text-[10px] font-mono uppercase tracking-wider text-stone-500">
                    <th class="py-2.5 px-3 w-24">State</th>
                    <th class="py-2.5 px-2 w-20">LC #</th>
                    <th class="py-2.5 px-3">Problem & FE Signal</th>
                    <th class="py-2.5 px-3 hidden sm:table-cell w-36">Big-O</th>
                    <th class="py-2.5 px-3 text-right w-14">Note</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-stone-100 dark:divide-stone-800/80 text-xs sm:text-sm">
                  ${problems.map((prob, idx) => {
                    const prog = getDsaProgress(prob.id);
                    const isSelected = appState.selectedItem?.id === prob.id;
                    const statusConfig = {
                      'todo': { label: 'Todo', cls: 'bg-stone-100 dark:bg-stone-800 text-stone-600 dark:text-stone-400 border-stone-200 dark:border-stone-700' },
                      'in-progress': { label: 'Active', cls: 'bg-amber-500/15 text-amber-700 dark:text-amber-300 border-amber-500/30' },
                      'solved': { label: 'Solved', cls: 'bg-olympus-laurel/15 text-olympus-laurel dark:text-emerald-300 border-olympus-laurel/30' }
                    }[prog.status];

                    return `
                      <tr
                        data-nav-row="${idx}"
                        data-item-kind="dsa"
                        data-item-id="${prob.id}"
                        onclick="selectInspectorItem('dsa', '${prob.id}', ${idx})"

                        <td class="py-2 px-2 font-mono text-xs text-stone-500 whitespace-nowrap">

                        <td class="py-2 px-3">
                          <span class="font-semibold text-stone-900 dark:text-stone-100 ${prog.status === 'solved' ? 'line-through opacity-65' : ''}">${escapeHtml(prob.title)}</span>

                        <td class="py-2 px-3 hidden sm:table-cell font-mono text-[11px] text-stone-500 whitespace-nowrap">

                        <td class="py-2 px-3 text-right font-mono text-xs">
                          <span class="${prog.notes ? 'text-olympus-goldDark dark:text-olympus-goldLight font-bold' : 'text-stone-400'}">${prog.notes ? '✎' : '+'}</span>
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    /**
     * ----------------------------------------------------------------------------
     * VIEW E: UNIFIED INSTANT SEARCH
     * ----------------------------------------------------------------------------
     */
    function renderSearchResultsView(query) {
      const matchedSyllabus = [];
      CURRICULUM_DATA.syllabus.forEach(mod => {
        [...mod.practice, ...mod.interviewConcepts].forEach(item => {
          if (`${item.text} ${item.tags.join(' ')} ${mod.title}`.toLowerCase().includes(query)) {
            matchedSyllabus.push({ mod, item });
          }
        });
      });

      const matchedProjects = CURRICULUM_DATA.projects.filter(p =>
        `${p.title} ${p.summary} ${p.skillsProven.join(' ')}`.toLowerCase().includes(query)
      );

      const matchedDsa = CURRICULUM_DATA.dsa.problems.filter(p =>
        `${p.title} ${p.leetcodeId} ${p.frontendRelevance || ''} ${p.categoryCode}`.toLowerCase().includes(query)
      );

      const total = matchedSyllabus.length + matchedProjects.length + matchedDsa.length;
      let idx = 0;

      return `
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h2 class="font-display text-base font-bold text-stone-900 dark:text-white">
              ${total} Match${total === 1 ? '' : 'es'} for “${escapeHtml(appState.searchQuery)}”
            </h2>
            <button onclick="clearGlobalSearch()" class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-stone-200/80 dark:bg-stone-800">Clear (Esc)</button>
          </div>

          ${matchedSyllabus.length > 0 ? `
            <div class="rounded-2xl bg-white dark:bg-marble-900 border border-stone-200 dark:border-stone-800 overflow-hidden">
              <div class="px-4 py-2 bg-marble-100/70 dark:bg-stone-900/70 border-b border-stone-200 dark:border-stone-800 text-xs font-mono font-semibold">VIII Pillars (${matchedSyllabus.length})</div>
              <div class="divide-y divide-stone-100 dark:divide-stone-800">
                ${matchedSyllabus.map(({ item }) => renderCompactChecklistRow(item, idx++)).join('')}
              </div>
            </div>
          ` : ''}

          ${matchedDsa.length > 0 ? `
            <div class="rounded-2xl bg-white dark:bg-marble-900 border border-stone-200 dark:border-stone-800 overflow-hidden">
              <div class="px-4 py-2 bg-marble-100/70 dark:bg-stone-900/70 border-b border-stone-200 dark:border-stone-800 text-xs font-mono font-semibold">DSA 50 (${matchedDsa.length})</div>
              <div class="divide-y divide-stone-100 dark:divide-stone-800">
                ${matchedDsa.map(prob => {
                  const prog = getDsaProgress(prob.id);
                  return `
                    <div onclick="selectInspectorItem('dsa', '${prob.id}')" class="cursor-pointer px-4 py-2.5 hover:bg-marble-50 dark:hover:bg-stone-800/40 flex items-center justify-between gap-2 text-xs">
                      <div>
                        <span class="font-mono text-stone-400 mr-1.5">#${prob.leetcodeId}</span>
                        <span class="font-semibold">${escapeHtml(prob.title)}</span>
                        ${prob.frontendRelevance ? `<span class="ml-2 text-olympus-goldDark dark:text-olympus-goldLight">★ ${escapeHtml(prob.frontendRelevance)}</span>` : ''}
                      </div>
                      <button onclick="event.stopPropagation(); cycleDsaStatus('${prob.id}')" class="px-2 py-0.5 rounded font-mono bg-stone-100 dark:bg-stone-800">${prog.status}</button>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          ` : ''}

          ${matchedProjects.length > 0 ? `
            <div class="rounded-2xl bg-white dark:bg-marble-900 border border-stone-200 dark:border-stone-800 overflow-hidden">
              <div class="px-4 py-2 bg-marble-100/70 dark:bg-stone-900/70 border-b border-stone-200 dark:border-stone-800 text-xs font-mono font-semibold">V Labors (${matchedProjects.length})</div>
              <div class="divide-y divide-stone-100 dark:divide-stone-800">
                ${matchedProjects.map(proj => `
                  <div onclick="selectInspectorItem('project', '${proj.id}')" class="cursor-pointer px-4 py-2.5 hover:bg-marble-50 dark:hover:bg-stone-800/40 flex items-center justify-between text-xs">
                    <span class="font-semibold">${escapeHtml(proj.title)}</span>
                    <button onclick="event.stopPropagation(); toggleItemCompletion('${proj.id}')" class="px-2 py-0.5 rounded bg-olympus-gold/15 text-olympus-goldDark dark:text-olympus-goldLight font-semibold">Toggle</button>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    /**
     * ============================================================================
     * 6. PERSISTENT DESKTOP INSPECTOR & MOBILE DRAWER (Auto-Save on Blur/Input)
     * ============================================================================
     */
    function buildInspectorHtml(kind, id, prefix) {
      if (kind === 'dsa') {
        const prob = CURRICULUM_DATA.dsa.problems.find(p => p.id === id);
        if (!prob) return '';
        const prog = getDsaProgress(id);
        const isSolved = prog.status === 'solved';

        return `
          <div class="p-4 border-b border-stone-200 dark:border-stone-800 bg-marble-100/60 dark:bg-stone-900/60">
            <div class="flex items-center justify-between gap-2 mb-1">
              <span class="text-[10px] font-mono uppercase tracking-wider px-2 py-0.5 rounded bg-olympus-laurel/15 text-olympus-laurel dark:text-emerald-300 font-semibold">LC #${prob.leetcodeId} • Cat ${prob.categoryCode}</span>
              <button onclick="cycleDsaStatus('${id}')" class="px-2.5 py-1 rounded-md text-[11px] font-mono font-semibold ${isSolved ? 'bg-olympus-laurel text-white' : 'bg-olympus-gold text-white'}">
                ${prog.status.toUpperCase()}
              </button>
            </div>
            <h3 class="font-display font-bold text-sm text-stone-900 dark:text-white leading-snug">${escapeHtml(prob.title)}</h3>
          </div>

          <div class="p-4 space-y-3 overflow-y-auto flex-1 text-xs">
            ${prob.frontendRelevance ? `
              <div class="p-2.5 rounded-lg bg-olympus-gold/10 border border-olympus-gold/25 text-olympus-goldDark dark:text-olympus-goldLight">
                <strong>FE Signal:</strong> ${escapeHtml(prob.frontendRelevance)}
              </div>
            ` : ''}

            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[10px] font-mono uppercase text-stone-400 mb-1">Language</label>
                <select id="${prefix}-dsa-lang" onchange="autoSaveInspector('${kind}', '${id}', '${prefix}')" class="w-full px-2.5 py-1.5 rounded-lg bg-marble-50 dark:bg-marble-950 border border-stone-200 dark:border-stone-800 text-xs">
                  <option value="TypeScript" ${prog.solutionLanguage === 'TypeScript' ? 'selected' : ''}>TypeScript</option>
                  <option value="JavaScript" ${prog.solutionLanguage === 'JavaScript' ? 'selected' : ''}>JavaScript</option>
                </select>
              </div>
              <div>
                <label class="block text-[10px] font-mono uppercase text-stone-400 mb-1">Attempts</label>
                <input id="${prefix}-dsa-attempts" type="number" min="0" value="${prog.attempts || 0}" onchange="autoSaveInspector('${kind}', '${id}', '${prefix}')" class="w-full px-2.5 py-1.5 rounded-lg bg-marble-50 dark:bg-marble-950 border border-stone-200 dark:border-stone-800 text-xs font-mono" />
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[10px] font-mono uppercase text-stone-400 mb-1">Time Big-O</label>
                <input id="${prefix}-dsa-time" type="text" placeholder="O(n)" value="${escapeHtml(prog.timeComplexity || '')}" oninput="autoSaveInspector('${kind}', '${id}', '${prefix}')" class="w-full px-2.5 py-1.5 rounded-lg bg-marble-50 dark:bg-marble-950 border border-stone-200 dark:border-stone-800 text-xs font-mono" />
              </div>
              <div>
                <label class="block text-[10px] font-mono uppercase text-stone-400 mb-1">Space Big-O</label>
                <input id="${prefix}-dsa-space" type="text" placeholder="O(1)" value="${escapeHtml(prog.spaceComplexity || '')}" oninput="autoSaveInspector('${kind}', '${id}', '${prefix}')" class="w-full px-2.5 py-1.5 rounded-lg bg-marble-50 dark:bg-marble-950 border border-stone-200 dark:border-stone-800 text-xs font-mono" />
              </div>
            </div>

            <div>
              <div class="flex items-center justify-between mb-1">
                <label class="text-[10px] font-mono uppercase text-slate-400">Notes & Pattern</label>
                <span class="text-[10px] text-slate-400">Auto-saved</span>
              </div>
              <textarea id="${prefix}-notes" rows="7" placeholder="Write intuition, optimal pattern, or gotchas..." oninput="autoSaveInspector('${kind}', '${id}', '${prefix}')" class="w-full p-2.5 rounded-xl bg-marble-50 dark:bg-marble-950 border border-slate-200 dark:border-slate-800 text-xs leading-relaxed focus:outline-none focus:ring-1 focus:ring-olympus-aegean">${escapeHtml(prog.notes || '')}</textarea>
            </div>
          </div>
        `;
      }

      // Item or Project
      let itemObj = null;
      let badgeText = '';
      if (kind === 'project') {
        itemObj = CURRICULUM_DATA.projects.find(p => p.id === id);
        badgeText = `Project 0${itemObj.order} • ${itemObj.tierLabel}`;
      } else {
        for (const mod of CURRICULUM_DATA.syllabus) {
          const found = [...mod.practice, ...mod.interviewConcepts].find(i => i.id === id);
          if (found) {
            itemObj = found;
            badgeText = `Module 0${mod.order} • ${found.type === 'practice' ? 'Practice' : 'Concept'}`;
            break;
          }
        }
      }
      if (!itemObj) return '';
      const prog = getItemProgress(id);

      return `
        <div class="p-4 border-b border-slate-200 dark:border-slate-800 bg-marble-100/60 dark:bg-slate-900/60">
          <div class="flex items-center justify-between gap-2 mb-1">
            <span class="text-[10px] font-mono uppercase tracking-wider px-2 py-0.5 rounded bg-olympus-aegean/10 text-olympus-aegean dark:text-olympus-aegeanLight font-semibold">${escapeHtml(badgeText)}</span>
            <button onclick="toggleItemCompletion('${id}')" class="px-2.5 py-1 rounded-md text-[11px] font-semibold ${prog.completed ? 'bg-olympus-laurel text-white' : 'bg-olympus-aegean text-white'}">
              ${prog.completed ? '✓ Done' : 'Complete'}
            </button>
          </div>
          <h3 class="font-semibold text-sm text-slate-900 dark:text-white leading-snug">${escapeHtml(itemObj.title || itemObj.text)}</h3>
        </div>

        <div class="p-4 space-y-3 overflow-y-auto flex-1 text-xs">
          ${itemObj.summary ? `<p class="text-slate-600 dark:text-slate-300 leading-relaxed">${escapeHtml(itemObj.summary)}</p>` : ''}
          <div>
            <div class="flex items-center justify-between mb-1">
              <label class="text-[10px] font-mono uppercase text-slate-400">${kind === 'project' ? 'Repo URL & Architecture' : 'Notes & Takeaways'}</label>
              <span class="text-[10px] text-slate-400">Auto-saved</span>
            </div>
            <textarea id="${prefix}-notes" rows="9" placeholder="Add code notes, repo URLs, or interview takeaways..." oninput="autoSaveInspector('${kind}', '${id}', '${prefix}')" class="w-full p-2.5 rounded-xl bg-marble-50 dark:bg-marble-950 border border-slate-200 dark:border-slate-800 text-xs leading-relaxed focus:outline-none focus:ring-1 focus:ring-olympus-aegean">${escapeHtml(prog.notes || '')}</textarea>
          </div>
          ${prog.completedAt ? `<div class="text-[10px] font-mono text-slate-400">Completed: ${new Date(prog.completedAt).toLocaleDateString()}</div>` : ''}
        </div>
      `;
    }

    function renderDesktopInspector() {
      const panel = document.getElementById('desktop-inspector');
      if (!panel || !appState.selectedItem) return;
      panel.innerHTML = buildInspectorHtml(appState.selectedItem.kind, appState.selectedItem.id, 'desk');
    }

    let autoSaveTimer = null;
    function autoSaveInspector(kind, id, prefix) {
      clearTimeout(autoSaveTimer);
      autoSaveTimer = setTimeout(() => {
        const notesVal = document.getElementById(`${prefix}-notes`)?.value || '';
        if (kind === 'dsa') {
          const current = getDsaProgress(id);
          appState.dsaProblems[id] = {
            ...current,
            solutionLanguage: document.getElementById(`${prefix}-dsa-lang`)?.value || current.solutionLanguage,
            attempts: parseInt(document.getElementById(`${prefix}-dsa-attempts`)?.value, 10) || 0,
            timeComplexity: document.getElementById(`${prefix}-dsa-time`)?.value.trim() || '',
            spaceComplexity: document.getElementById(`${prefix}-dsa-space`)?.value.trim() || '',
            notes: notesVal
          };
        } else {
          const current = getItemProgress(id);
          appState.items[id] = { ...current, notes: notesVal };
        }
        saveState();
      }, 250);
    }

    function selectInspectorItem(kind, id, rowIndex = null) {
      appState.selectedItem = { kind, id };
      if (rowIndex !== null) appState.focusedIndex = rowIndex;
      saveState();

      // On xl+ screens, update persistent inspector without opening modal drawer
      if (window.innerWidth >= 1280) {
        renderCurrentView();
      } else {
        openDetailDrawer(kind, id);
      }
    }

    function openDetailDrawer(kind, id) {
      activeDrawerItem = { kind, id };
      const backdrop = document.getElementById('detail-drawer-backdrop');
      const drawer = document.getElementById('detail-drawer');
      const badgeEl = document.getElementById('drawer-badge');
      const titleEl = document.getElementById('drawer-title');
      const bodyEl = document.getElementById('drawer-body');
      const toggleBtn = document.getElementById('drawer-toggle-complete');

      if (kind === 'dsa') {
        const prob = CURRICULUM_DATA.dsa.problems.find(p => p.id === id);
        const prog = getDsaProgress(id);
        badgeEl.textContent = `LC #${prob.leetcodeId} • Cat ${prob.categoryCode}`;
        titleEl.textContent = prob.title;
        bodyEl.innerHTML = buildInspectorHtml('dsa', id, 'mob');
        // Strip duplicate header inside mobile drawer body
        bodyEl.firstElementChild?.remove();

        const isSolved = prog.status === 'solved';
        toggleBtn.className = `px-3.5 py-2 rounded-lg text-xs font-semibold ${isSolved ? 'bg-olympus-laurel text-white' : 'bg-stone-200 dark:bg-stone-800 text-stone-800 dark:text-stone-200'}`;
        toggleBtn.textContent = isSolved ? '✓ Solved' : 'Cycle Status';
        toggleBtn.onclick = () => cycleDsaStatus(id);
      } else {
        let itemObj = kind === 'project'
          ? CURRICULUM_DATA.projects.find(p => p.id === id)
          : CURRICULUM_DATA.syllabus.flatMap(m => [...m.practice, ...m.interviewConcepts]).find(i => i.id === id);
        const prog = getItemProgress(id);
        badgeEl.textContent = kind === 'project' ? `Project 0${itemObj.order}` : (itemObj.type === 'practice' ? 'Practice' : 'Concept');
        titleEl.textContent = itemObj.title || itemObj.text;
        bodyEl.innerHTML = buildInspectorHtml(kind, id, 'mob');
        bodyEl.firstElementChild?.remove();

        toggleBtn.className = `px-3.5 py-2 rounded-lg text-xs font-semibold ${prog.completed ? 'bg-olympus-laurel text-white' : 'bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-slate-200'}`;
        toggleBtn.textContent = prog.completed ? '✓ Done' : 'Mark Done';
        toggleBtn.onclick = () => toggleItemCompletion(id);
      }

      backdrop.classList.remove('hidden');
      requestAnimationFrame(() => {
        backdrop.classList.remove('opacity-0');
        drawer.classList.remove('translate-x-full');
        drawer.setAttribute('aria-hidden', 'false');
      });
    }

    function closeDetailDrawer() {
      const backdrop = document.getElementById('detail-drawer-backdrop');
      const drawer = document.getElementById('detail-drawer');
      backdrop.classList.add('opacity-0');
      drawer.classList.add('translate-x-full');
      drawer.setAttribute('aria-hidden', 'true');
      setTimeout(() => {
        backdrop.classList.add('hidden');
        activeDrawerItem = null;
        renderCurrentView();
      }, 220);
    }

    /**
     * ============================================================================
     * 7. MUTATIONS & KEYBOARD COMMAND ENGINE
     * ============================================================================
     */
    function toggleItemCompletion(id) {
      const current = getItemProgress(id);
      const nextCompleted = !current.completed;
      appState.items[id] = {
        ...current,
        completed: nextCompleted,
        completedAt: nextCompleted ? new Date().toISOString() : null
      };
      saveState();
      renderCurrentView();
      if (activeDrawerItem && activeDrawerItem.id === id) openDetailDrawer(activeDrawerItem.kind, id);
      showToast(nextCompleted ? 'Completed ✓' : 'Marked incomplete');
    }

    function completeModuleBatch(modId) {
      const mod = CURRICULUM_DATA.syllabus.find(m => m.id === modId);
      if (!mod) return;
      const now = new Date().toISOString();
      [...mod.practice, ...mod.interviewConcepts].forEach(item => {
        const cur = getItemProgress(item.id);
        if (!cur.completed) {
          appState.items[item.id] = { ...cur, completed: true, completedAt: now };
        }
      });
      saveState();
      renderCurrentView();
      showToast(`Module 0${mod.order} completed!`);
    }

    function completeModuleBatch(modId) {
      const mod = CURRICULUM_DATA.syllabus.find(m => m.id === modId);
      if (!mod) return;
      const now = new Date().toISOString();
      [...mod.practice, ...mod.interviewConcepts].forEach(item => {
        const cur = getItemProgress(item.id);
        if (!cur.completed) {
          appState.items[item.id] = { ...cur, completed: true, completedAt: now };
        }
      });
      saveState();
      renderCurrentView();
      showToast(`Pillar ${mod.roman} mastered!`);
    }

    function cycleDsaStatus(id) {
      const current = getDsaProgress(id);
      const order = ['todo', 'in-progress', 'solved'];
      const nextStatus = order[(order.indexOf(current.status) + 1) % order.length];

      appState.dsaProblems[id] = {
        ...current,
        status: nextStatus,
        attempts: nextStatus !== 'todo' ? Math.max(1, (current.attempts || 0) + (nextStatus === 'solved' ? 0 : 1)) : current.attempts,
        completedAt: nextStatus === 'solved' ? new Date().toISOString() : null
      };
      saveState();
      renderCurrentView();
      if (activeDrawerItem && activeDrawerItem.id === id) openDetailDrawer('dsa', id);
      showToast({ 'todo': 'Status: Todo', 'in-progress': 'Status: Active', 'solved': 'Solved ✓' }[nextStatus]);
    }

    function setModuleFilter(modId) {
      appState.activeModuleFilter = modId;
      renderCurrentView();
    }

    function setPillarTypeFilter(type) {
      appState.activePillarTypeFilter = type;
      renderCurrentView();
    }

    function jumpToPillar(modId) {
      appState.activeModuleFilter = modId;
      switchView('pillars');
    }

    function setProjectFilter(filter) {
      appState.activeProjectFilter = filter;
      renderCurrentView();
    }

    function setDsaCategory(catId) {
      appState.activeDsaCategory = catId;
      renderCurrentView();
    }

    function setDsaStatusFilter(status) {
      appState.activeDsaStatusFilter = status;
      renderCurrentView();
    }

    function clearGlobalSearch() {
      appState.searchQuery = '';
      document.getElementById('global-search').value = '';
      renderCurrentView();
    }

    window.addEventListener('DOMContentLoaded', () => {
      applyTheme(appState.theme);
      updateHideCompletedBtn();

      document.querySelectorAll('.nav-btn, .mobile-nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          clearGlobalSearch();
          switchView(btn.dataset.view);
        });
      });

      document.getElementById('hide-completed-toggle').addEventListener('click', () => {
        appState.hideCompleted = !appState.hideCompleted;
        updateHideCompletedBtn();
        saveState();
        renderCurrentView();
      });

      document.getElementById('theme-toggle').addEventListener('click', () => {
        const next = appState.theme === 'dark' ? 'light' : 'dark';
        applyTheme(next);
      });

      let searchTimeout = null;
      const searchInput = document.getElementById('global-search');
      searchInput.addEventListener('input', (e) => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
          appState.searchQuery = e.target.value;
          renderCurrentView();
        }, 120);
      });

      // Power-User Keyboard Shortcuts: 1-4 Views, / Search, J/K Row Navigation, Space Toggle
      document.addEventListener('keydown', (e) => {
        const tag = document.activeElement.tagName;
        const isInput = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';

        if (e.key === 'Escape') {
          if (activeDrawerItem) closeDetailDrawer();
          else if (isInput) document.activeElement.blur();
          else if (appState.searchQuery) clearGlobalSearch();
          return;
        }

        if (isInput) return;

        if (e.key === '/') {
          e.preventDefault();
          searchInput.focus();
        } else if (e.key === '1') switchView('sanctuary');
        else if (e.key === '2') switchView('pillars');
        else if (e.key === '3') switchView('labors');
        else if (e.key === '4') switchView('agora');
        else if (e.key === 'j' || e.key === 'k') {
          const rows = Array.from(document.querySelectorAll('[data-nav-row]'));
          if (rows.length === 0) return;
          e.preventDefault();
          const delta = e.key === 'j' ? 1 : -1;
          const nextIdx = Math.max(0, Math.min(rows.length - 1, appState.focusedIndex + delta));
          const target = rows[nextIdx];
          if (target) {
            appState.focusedIndex = nextIdx;
            appState.selectedItem = { kind: target.dataset.itemKind, id: target.dataset.itemId };
            renderCurrentView();
            document.querySelector(`[data-nav-row="${nextIdx}"]`)?.scrollIntoView({ block: 'nearest' });
          }
        } else if (e.key === ' ') {
          const rows = document.querySelectorAll('[data-nav-row]');
          const target = rows[appState.focusedIndex];
          if (target) {
            e.preventDefault();
            if (target.dataset.itemKind === 'dsa') cycleDsaStatus(target.dataset.itemId);
            else toggleItemCompletion(target.dataset.itemId);
          }
        }
      });

      document.getElementById('drawer-close-btn').addEventListener('click', closeDetailDrawer);
      document.getElementById('detail-drawer-backdrop').addEventListener('click', closeDetailDrawer);
      document.getElementById('drawer-save-btn').addEventListener('click', closeDetailDrawer);

      document.getElementById('export-progress-btn').addEventListener('click', () => {
        const payload = JSON.stringify({
          exportedAt: new Date().toISOString(),
          curriculumId: CURRICULUM_DATA.meta.id,
          telemetry: computeTelemetry(),
          items: appState.items,
          dsaProblems: appState.dsaProblems
        }, null, 2);

        const helper = document.createElement('textarea');
        helper.value = payload;
        helper.style.position = 'fixed';
        helper.style.opacity = '0';
        document.body.appendChild(helper);
        helper.select();
        try {
          document.execCommand('copy');
          showToast('Progress JSON copied!', 'success');
        } catch (err) {
          showToast('Copy failed.');
        }
        document.body.removeChild(helper);
      });

      updateGlobalTelemetry();
      switchView(appState.activeView);
    });
  </script>
</body>
</html>

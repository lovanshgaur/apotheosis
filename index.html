<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1D4ED8" />
  <meta name="description" content="0-to-Hero Frontend Engineering Curriculum, Portfolio Projects & DSA 50 Tracker" />
  <title>APOTHEOSIS — Frontend Engineering Roadmap</title>

  <!-- Fonts: Inter (Primary UI), Cinzel (Brand Wordmark), JetBrains Mono (Code & Metrics) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            display: ['Cinzel', 'Georgia', 'serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#EFF6FF',
              100: '#DBEAFE',
              500: '#3B82F6',
              600: '#2563EB',
              700: '#1D4ED8',
            },
            gold: {
              400: '#FBBF24',
              500: '#F59E0B',
              600: '#D97706',
            }
          }
        }
      }
    };
  </script>

  <style>
    /* Subtle scrollbar styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.35);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 0.55);
    }

    /* Hide scrollbar on horizontal filter pill rails */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Subtle fade-in for view transitions only */
    @keyframes viewFadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .view-animate {
      animation: viewFadeIn 0.18s ease-out;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 font-sans antialiased selection:bg-blue-600/20 selection:text-blue-700 dark:selection:text-blue-300 transition-colors duration-200 min-h-screen">

  <!-- Toast Notification Container -->
  <div id="toast-container" aria-live="polite" class="fixed bottom-20 md:bottom-6 right-4 md:right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Main App Shell -->
  <div class="flex min-h-screen">

    <!-- Desktop Sidebar Navigation -->
    <aside class="hidden md:flex flex-col w-64 shrink-0 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 sticky top-0 h-screen z-20 justify-between">
      <div class="flex flex-col overflow-y-auto">
        <!-- Brand Header -->
        <div class="px-5 py-5 border-b border-slate-100 dark:border-slate-800/80">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-slate-900 to-blue-900 dark:from-blue-600 dark:to-indigo-700 flex items-center justify-center text-amber-300 shadow-sm shrink-0">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 21h18M4 18h16M6 18V9M10 18V9M14 18V9M18 18V9M2 9l10-6 10 6H2z"/>
              </svg>
            </div>
            <div class="min-w-0">
              <h1 class="font-display font-bold text-sm tracking-wider text-slate-900 dark:text-white truncate">APOTHEOSIS</h1>
              <p class="text-[11px] text-slate-500 dark:text-slate-400 font-medium">Frontend Roadmap</p>
            </div>
          </div>
        </div>

        <!-- Primary Navigation -->
        <nav aria-label="Primary Navigation" class="p-3 space-y-1">
          <button data-view="overview" class="nav-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-semibold transition-colors">
            <span class="flex items-center gap-2.5">
              <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
              <span>Overview</span>
            </span>
            <span id="nav-overall-pct" class="font-mono text-[11px] opacity-80">0%</span>
          </button>

          <button data-view="modules" class="nav-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-medium transition-colors">
            <span class="flex items-center gap-2.5">
              <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
              <span>Modules</span>
            </span>
            <span id="nav-syllabus-count" class="font-mono text-[11px] opacity-75">0/53</span>
          </button>

          <button data-view="projects" class="nav-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-medium transition-colors">
            <span class="flex items-center gap-2.5">
              <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg>
              <span>Projects</span>
            </span>
            <span id="nav-projects-count" class="font-mono text-[11px] opacity-75">0/5</span>
          </button>

          <button data-view="dsa" class="nav-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-medium transition-colors">
            <span class="flex items-center gap-2.5">
              <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
              <span>DSA 50</span>
            </span>
            <span id="nav-dsa-count" class="font-mono text-[11px] opacity-75">0/50</span>
          </button>
        </nav>

        <!-- Focus Shortcuts -->
        <div class="px-3 pt-4">
          <div class="px-3 mb-2 text-[10px] font-mono uppercase tracking-wider text-slate-400">Quick Filters</div>
          <div class="space-y-1">
            <button onclick="quickJump('remaining-practice')" class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/70 transition-colors">
              <span>Remaining Practice</span>
              <span id="shortcut-practice-rem" class="font-mono text-[11px] font-semibold text-blue-600 dark:text-blue-400">26</span>
            </button>
            <button onclick="quickJump('flagships')" class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/70 transition-colors">
              <span>Flagship Projects</span>
              <span id="shortcut-flagship-rem" class="font-mono text-[11px] font-semibold text-amber-600 dark:text-amber-400">3</span>
            </button>
            <button onclick="quickJump('frontend-dsa')" class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/70 transition-colors">
              <span>Frontend DSA</span>
              <span class="font-mono text-[11px] font-semibold text-emerald-600 dark:text-emerald-400">13</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Bottom Milestone & Backup Card -->
      <div class="p-3 border-t border-slate-100 dark:border-slate-800/80">
        <div class="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-950/70 border border-slate-200/80 dark:border-slate-800">
          <div class="flex items-center justify-between mb-1">
            <span class="text-[10px] font-mono uppercase tracking-wider text-slate-400">Milestone</span>
            <span id="sidebar-rank-level" class="font-mono text-xs font-bold text-blue-600 dark:text-blue-400">L1</span>
          </div>
          <div id="sidebar-rank-title" class="text-sm font-semibold text-slate-900 dark:text-white mb-2">Foundations</div>
          <div class="w-full bg-slate-200 dark:bg-slate-800 h-1.5 rounded-full overflow-hidden mb-2.5">
            <div id="sidebar-progress-bar" class="bg-blue-600 dark:bg-blue-500 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
          </div>
          <div class="flex items-center justify-between text-[11px] text-slate-500 dark:text-slate-400">
            <span id="sidebar-xp-text" class="font-mono">0 / 108</span>
            <div class="flex items-center gap-2">
              <button onclick="openDataModal()" class="text-blue-600 dark:text-blue-400 hover:underline font-medium">Backup</button>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content Column -->
    <div class="flex-1 flex flex-col min-w-0 pb-20 md:pb-8">

      <!-- Sticky Top Command Bar -->
      <header class="sticky top-0 z-10 bg-slate-50/90 dark:bg-slate-950/90 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800/80 px-4 sm:px-6 py-3">
        <div class="max-w-5xl mx-auto flex items-center justify-between gap-3">

          <!-- Mobile Brand -->
          <div class="flex items-center gap-2 md:hidden shrink-0">
            <div class="w-7 h-7 rounded-lg bg-slate-900 dark:bg-blue-600 flex items-center justify-center text-amber-300">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M4 18h16M6 18V9M10 18V9M14 18V9M18 18V9M2 9l10-6 10 6H2z"/></svg>
            </div>
            <span class="font-display font-bold text-sm tracking-wider">APOTHEOSIS</span>
          </div>

          <!-- Search Input -->
          <div class="relative flex-1 max-w-md">
            <svg class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <input
              id="global-search"
              type="search"
              placeholder="Search modules, tags, LeetCode #... (/)"
              aria-label="Search curriculum"
              class="w-full pl-9 pr-9 py-2 text-xs sm:text-sm rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 transition-all placeholder:text-slate-400"
            />
            <kbd class="hidden sm:inline-block absolute right-2.5 top-1/2 -translate-y-1/2 text-[10px] font-mono px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-400 border border-slate-200 dark:border-slate-700">/</kbd>
          </div>

          <!-- Right Controls -->
          <div class="flex items-center gap-2 shrink-0">
            <!-- Telemetry Pill -->
            <div class="hidden lg:flex items-center gap-2 px-3 py-1.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-xs font-mono">
              <span id="topbar-pct" class="font-bold text-blue-600 dark:text-blue-400">0%</span>
              <span class="text-slate-300 dark:text-slate-700">•</span>
              <span id="topbar-trials" class="text-slate-500 dark:text-slate-400">0/108</span>
            </div>

            <!-- Hide Completed Toggle -->
            <button id="hide-completed-toggle" title="Hide completed items" class="flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-medium border transition-colors">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>
              <span id="hide-completed-label" class="hidden sm:inline">Hide Done</span>
            </button>

            <!-- Mobile Backup Button -->
            <button onclick="openDataModal()" aria-label="Backup or restore progress" class="md:hidden p-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:border-blue-500 transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
            </button>

            <!-- Theme Toggle -->
            <button id="theme-toggle" aria-label="Toggle Light or Dark Theme" class="p-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:border-blue-500 transition-colors">
              <svg class="w-4 h-4 hidden dark:block text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
              <svg class="w-4 h-4 block dark:hidden text-slate-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
            </button>
          </div>
        </div>
      </header>

      <!-- Main Viewport -->
      <main id="app-viewport" class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 pt-5">
        <!-- Rendered dynamically -->
      </main>
    </div>
  </div>

  <!-- Mobile Bottom Navigation -->
  <nav aria-label="Mobile Navigation" class="md:hidden fixed bottom-0 inset-x-0 z-20 bg-white/95 dark:bg-slate-900/95 backdrop-blur-lg border-t border-slate-200 dark:border-slate-800 px-2 py-1.5 flex justify-around items-center">
    <button data-view="overview" class="mobile-nav-btn flex flex-col items-center gap-0.5 py-1 px-3 rounded-xl transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      <span class="text-[10px]">Overview</span>
    </button>
    <button data-view="modules" class="mobile-nav-btn flex flex-col items-center gap-0.5 py-1 px-3 rounded-xl transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
      <span class="text-[10px]">Modules</span>
    </button>
    <button data-view="projects" class="mobile-nav-btn flex flex-col items-center gap-0.5 py-1 px-3 rounded-xl transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg>
      <span class="text-[10px]">Projects</span>
    </button>
    <button data-view="dsa" class="mobile-nav-btn flex flex-col items-center gap-0.5 py-1 px-3 rounded-xl transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
      <span class="text-[10px]">DSA 50</span>
    </button>
  </nav>

  <!-- Unified Closable Slide-Over Detail Drawer (Works cleanly on ALL screen sizes) -->
  <div id="drawer-backdrop" class="fixed inset-0 bg-slate-950/50 backdrop-blur-sm z-40 hidden opacity-0 transition-opacity duration-200" aria-hidden="true"></div>
  <aside id="detail-drawer" role="dialog" aria-modal="true" aria-hidden="true" class="fixed top-0 right-0 h-full w-full max-w-md bg-white dark:bg-slate-900 border-l border-slate-200 dark:border-slate-800 z-50 shadow-2xl transform translate-x-full transition-transform duration-200 ease-out flex flex-col">
    <!-- Drawer Header -->
    <div class="px-5 py-4 border-b border-slate-200 dark:border-slate-800 flex items-start justify-between gap-3 shrink-0">
      <div class="min-w-0">
        <span id="drawer-badge" class="inline-block text-[10px] font-mono uppercase tracking-wider px-2 py-0.5 rounded-md bg-blue-50 dark:bg-blue-500/15 text-blue-700 dark:text-blue-300 font-semibold mb-1.5"></span>
        <h2 id="drawer-title" class="font-semibold text-base text-slate-900 dark:text-white leading-snug"></h2>
      </div>
      <button id="drawer-close-x" type="button" aria-label="Close detail panel" class="p-2 -mr-1.5 -mt-1 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-colors shrink-0">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- Drawer Body -->
    <div id="drawer-body" class="flex-1 overflow-y-auto p-5 space-y-4"></div>

    <!-- Drawer Footer -->
    <div class="px-5 py-3.5 border-t border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950/60 flex items-center justify-between gap-3 shrink-0">
      <button id="drawer-status-btn" type="button" class="px-4 py-2 rounded-xl text-xs font-semibold transition-colors"></button>
      <button id="drawer-done-btn" type="button" class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-900 dark:bg-blue-600 hover:bg-slate-800 dark:hover:bg-blue-700 text-white transition-colors">
        Close
      </button>
    </div>
  </aside>

  <!-- Backup / Restore Modal -->
  <div id="data-modal-backdrop" class="fixed inset-0 bg-slate-950/50 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="w-full max-w-md rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-2xl overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
        <h3 class="font-semibold text-sm text-slate-900 dark:text-white">Backup &amp; Restore Progress</h3>
        <button onclick="closeDataModal()" aria-label="Close modal" class="p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="p-5 space-y-4 text-xs">
        <p class="text-slate-600 dark:text-slate-400 leading-relaxed">
          Your progress and notes are saved locally in your browser. Copy your JSON backup or paste an existing backup below to restore.
        </p>
        <div class="flex gap-2">
          <button onclick="exportProgressJson()" class="flex-1 py-2.5 px-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold transition-colors">
            Copy Backup JSON
          </button>
        </div>
        <div class="space-y-1.5">
          <label for="import-json-input" class="block text-[11px] font-mono uppercase text-slate-400">Restore from JSON</label>
          <textarea id="import-json-input" rows="4" placeholder="Paste exported JSON here..." class="w-full p-3 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 font-mono text-[11px] focus:outline-none focus:ring-2 focus:ring-blue-500/30"></textarea>
          <button onclick="importProgressJson()" class="w-full py-2 px-3 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 font-semibold transition-colors">

    let activeDrawer = null; // { kind: 'item' | 'project' | 'dsa', id: string } | null
    let drawerCloseTimer = null;

    function loadState() {
      try {
        let raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          for (const key of LEGACY_KEYS) {
            raw = localStorage.getItem(key);
            if (raw) break;
          }
        }
        if (!raw) return structuredClone(DEFAULT_STATE);
        const parsed = JSON.parse(raw);

        // Normalize legacy view names if migrating from v2/v3
        const viewMap = {
          sanctuary: 'overview',
          pillars: 'modules',
          labors: 'projects',
          agora: 'dsa'
        };
        const normalizedView = viewMap[parsed.activeView] || parsed.activeView || 'overview';

        return {
          ...structuredClone(DEFAULT_STATE),
          ...parsed,
          activeView: ['overview', 'modules', 'projects', 'dsa'].includes(normalizedView) ? normalizedView : 'overview'
        };
      } catch (err) {
        return structuredClone(DEFAULT_STATE);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (err) {
        showToast('Storage limit reached — changes kept in session.', 'warning');
      }
      updateGlobalTelemetry();
    }

    function getItemProgress(id) {
      return appState.items[id] || { completed: false, completedAt: null, notes: '' };
    }

    function getDsaProgress(id) {
      return appState.dsaProblems[id] || {
        status: 'todo',
        completedAt: null,
        attempts: 0,
        solutionLanguage: CURRICULUM_DATA.meta.defaultLanguage,
        timeComplexity: '',
        spaceComplexity: '',
        notes: ''
      };
    }

    /**
     * ============================================================================
     * 3. TELEMETRY & MILESTONES
     * ============================================================================
     */
    function computeTelemetry() {
      let syllabusTotal = 0;
      let syllabusDone = 0;
      let practiceRem = 0;

      for (const mod of CURRICULUM_DATA.syllabus) {
        for (const p of mod.practice) {
          syllabusTotal++;
          if (getItemProgress(p.id).completed) syllabusDone++;
          else practiceRem++;
        }
        for (const c of mod.interviewConcepts) {
          syllabusTotal++;
          if (getItemProgress(c.id).completed) syllabusDone++;
        }
      }

      const projectsTotal = CURRICULUM_DATA.projects.length;
      let projectsDone = 0;
      let flagshipRem = 0;
      for (const proj of CURRICULUM_DATA.projects) {
        if (getItemProgress(proj.id).completed) projectsDone++;
        else if (proj.isFlagship) flagshipRem++;
      }

      const dsaTotal = CURRICULUM_DATA.dsa.problems.length;
      let dsaSolved = 0;
      for (const prob of CURRICULUM_DATA.dsa.problems) {
        if (getDsaProgress(prob.id).status === 'solved') dsaSolved++;
      }

      const totalItems = syllabusTotal + projectsTotal + dsaTotal;
      const completedItems = syllabusDone + projectsDone + dsaSolved;
      const pct = totalItems > 0 ? Math.round((completedItems / totalItems) * 100) : 0;

      let rank = { level: 'L1', title: 'Foundations', subtitle: 'HTML, CSS & Core JS' };
      if (pct >= 100) rank = { level: 'L6', title: 'Apotheosis', subtitle: 'Senior Frontend Ready' };
      else if (pct >= 75) rank = { level: 'L5', title: 'Production Ready', subtitle: 'Flagships & Scale' };
      else if (pct >= 50) rank = { level: 'L4', title: 'System Builder', subtitle: 'React & State Architecture' };
      else if (pct >= 25) rank = { level: 'L3', title: 'Core Engineer', subtitle: 'JS Internals & TypeScript' };
      else if (pct >= 10) rank = { level: 'L2', title: 'Apprentice', subtitle: 'Responsive UI & DOM' };

      return {
        syllabusTotal, syllabusDone, practiceRem,
        projectsTotal, projectsDone, flagshipRem,
        dsaTotal, dsaSolved,
        totalItems, completedItems, pct, rank
      };
    }

    function updateGlobalTelemetry() {
      const t = computeTelemetry();
      setText('nav-overall-pct', `${t.pct}%`);
      setText('nav-syllabus-count', `${t.syllabusDone}/${t.syllabusTotal}`);
      setText('nav-projects-count', `${t.projectsDone}/${t.projectsTotal}`);
      setText('nav-dsa-count', `${t.dsaSolved}/${t.dsaTotal}`);
      setText('topbar-pct', `${t.pct}%`);
      setText('topbar-trials', `${t.completedItems}/${t.totalItems}`);
      setText('shortcut-practice-rem', String(t.practiceRem));
      setText('shortcut-flagship-rem', String(t.flagshipRem));
      setText('sidebar-rank-level', t.rank.level);
      setText('sidebar-rank-title', t.rank.title);
      setText('sidebar-xp-text', `${t.completedItems} / ${t.totalItems}`);

      const bar = document.getElementById('sidebar-progress-bar');
      if (bar) bar.style.width = `${t.pct}%`;
    }

    function setText(id, val) {
      const el = document.getElementById(id);
      if (el) el.textContent = val;
    }

    /**
     * ============================================================================
     * 4. UI UTILITIES & NOTIFICATIONS
     * ============================================================================
     */
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const dotColor = type === 'success'
        ? 'bg-emerald-500'
        : type === 'warning'
          ? 'bg-amber-500'
          : 'bg-blue-500';

      const toast = document.createElement('div');
      toast.className = 'pointer-events-auto flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 shadow-lg text-xs font-medium text-slate-800 dark:text-slate-100 max-w-xs transition-all duration-200 opacity-0 translate-y-2';
      toast.innerHTML = `<span class="w-2 h-2 rounded-full ${dotColor} shrink-0"></span><span>${escapeHtml(message)}</span>`;
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('opacity-0', 'translate-y-2');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 200);
      }, 2200);
    }

    function applyTheme(theme) {
      const root = document.documentElement;
      if (theme === 'dark') root.classList.add('dark');
      else root.classList.remove('dark');
      appState.theme = theme;
      saveState();
    }

    function updateHideCompletedBtn() {
      const btn = document.getElementById('hide-completed-toggle');
      const label = document.getElementById('hide-completed-label');
      if (!btn || !label) return;

      if (appState.hideCompleted) {
        btn.className = 'flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold bg-blue-50 dark:bg-blue-500/15 border border-blue-500/40 text-blue-700 dark:text-blue-300 transition-colors';
        label.textContent = 'Hiding Done';
      } else {
        btn.className = 'flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-medium bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-blue-500 text-slate-600 dark:text-slate-300 transition-colors';
        label.textContent = 'Hide Done';
      }
    }

    /**
     * ============================================================================
     * 5. NAVIGATION & VIEW RENDERING
     * ============================================================================
     */
    function switchView(viewName, animate = true) {
      appState.activeView = viewName;
      saveState();

      document.querySelectorAll('.nav-btn').forEach(btn => {
        const isActive = btn.dataset.view === viewName;
        btn.className = isActive
          ? 'nav-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-semibold transition-colors bg-blue-50 dark:bg-blue-500/15 text-blue-700 dark:text-blue-300'
          : 'nav-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/70 transition-colors';
      });

      document.querySelectorAll('.mobile-nav-btn').forEach(btn => {
        const isActive = btn.dataset.view === viewName;
        btn.className = isActive
          ? 'mobile-nav-btn flex flex-col items-center gap-0.5 py-1 px-3 rounded-xl text-blue-600 dark:text-blue-400 font-semibold transition-colors'
          : 'mobile-nav-btn flex flex-col items-center gap-0.5 py-1 px-3 rounded-xl text-slate-500 dark:text-slate-400 font-medium transition-colors';
      });

      renderCurrentView(animate);
    }

    function quickJump(preset) {
      clearGlobalSearch(false);
      if (preset === 'remaining-practice') {
        appState.activeModuleFilter = 'all';
        appState.activeTypeFilter = 'practice';
        appState.hideCompleted = true;
        updateHideCompletedBtn();
        switchView('modules');
      } else if (preset === 'flagships') {
        appState.activeProjectFilter = 'flagship';
        switchView('projects');
      } else if (preset === 'frontend-dsa') {
        appState.activeDsaCategory = 'all';
        appState.activeDsaStatus = 'relevance';
        switchView('dsa');
      }
    }

    function renderCurrentView(animate = false) {
      const viewport = document.getElementById('app-viewport');
      if (!viewport) return;

      const query = appState.searchQuery.trim().toLowerCase();
      let html = '';

      if (query.length > 0) {
        html = renderSearchView(query);
      } else {
        switch (appState.activeView) {
          case 'modules':
            html = renderModulesView();
            break;
          case 'projects':
            html = renderProjectsView();
            break;
          case 'dsa':
            html = renderDsaView();
            break;
          case 'overview':
          default:
            html = renderOverviewView();
            break;
        }
      }

      viewport.innerHTML = `<div class="${animate ? 'view-animate' : ''}">${html}</div>`;
    }

    /* --------------------------------------------------------------------------

    function renderSearchView(query) {
      const matchedSyllabus = [];
      for (const mod of CURRICULUM_DATA.syllabus) {
        for (const item of [...mod.practice, ...mod.interviewConcepts]) {
          if (`${item.text} ${item.tags.join(' ')} ${mod.title}`.toLowerCase().includes(query)) {
            matchedSyllabus.push(item);
          }
        }
      }

      const matchedProjects = CURRICULUM_DATA.projects.filter(p =>
        `${p.title} ${p.summary} ${p.skillsProven.join(' ')}`.toLowerCase().includes(query)
      );

      const matchedDsa = CURRICULUM_DATA.dsa.problems.filter(p =>
        `${p.title} ${p.leetcodeId} ${p.frontendRelevance || ''} ${p.categoryCode}`.toLowerCase().includes(query)
      );

      const total = matchedSyllabus.length + matchedProjects.length + matchedDsa.length;

      return `
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h2 class="text-base font-bold text-slate-900 dark:text-white">
              ${total} Match${total === 1 ? '' : 'es'} for “${escapeHtml(appState.searchQuery)}”

            <button onclick="clearGlobalSearch()" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 transition-colors">Clear</button>

    /**
     * ============================================================================
     * 6. UNIFIED CLOSABLE DETAIL DRAWER (Zero Stuck-Sidebar Bug)
     * ============================================================================
     */
    function openDrawer(kind, id) {
      // Cancel any pending hide timeout so reopening is instant and glitch-free
      if (drawerCloseTimer) {
        clearTimeout(drawerCloseTimer);
        drawerCloseTimer = null;
      }

      activeDrawer = { kind, id };
      populateDrawerContent(kind, id);

      const backdrop = document.getElementById('drawer-backdrop');
      const drawer = document.getElementById('detail-drawer');

      backdrop.classList.remove('hidden');
      document.body.style.overflow = 'hidden';

      requestAnimationFrame(() => {
        backdrop.classList.remove('opacity-0');
        drawer.classList.remove('translate-x-full');
        drawer.setAttribute('aria-hidden', 'false');
      });
    }

    function closeDrawer() {
      if (!activeDrawer) return;

      // Flush any current input values into state before closing
      persistDrawerInputs();

      const backdrop = document.getElementById('drawer-backdrop');
      const drawer = document.getElementById('detail-drawer');

      backdrop.classList.add('opacity-0');
      drawer.classList.add('translate-x-full');
      drawer.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      activeDrawer = null;

      drawerCloseTimer = setTimeout(() => {
        backdrop.classList.add('hidden');
        drawerCloseTimer = null;
      }, 200);

      renderCurrentView(false);
    }

    function populateDrawerContent(kind, id) {
      const badgeEl = document.getElementById('drawer-badge');
      const titleEl = document.getElementById('drawer-title');
      const bodyEl = document.getElementById('drawer-body');
      const statusBtn = document.getElementById('drawer-status-btn');

      if (kind === 'dsa') {
        const prob = CURRICULUM_DATA.dsa.problems.find(p => p.id === id);
        if (!prob) return;
        const prog = getDsaProgress(id);
        const isSolved = prog.status === 'solved';

        badgeEl.textContent = `LeetCode #${prob.leetcodeId} • Category ${prob.categoryCode}`;
        titleEl.textContent = prob.title;

        const lcSearchUrl = `https://leetcode.com/problemset/?search=${encodeURIComponent(prob.title)}`;

        bodyEl.innerHTML = `
          ${prob.frontendRelevance ? `
            <div class="p-3 rounded-xl bg-amber-50 dark:bg-amber-500/10 border border-amber-200 dark:border-amber-500/25 text-xs text-amber-800 dark:text-amber-300">
              <strong>Frontend Interview Signal:</strong> ${escapeHtml(prob.frontendRelevance)}
            </div>
          ` : ''}

          <a href="${lcSearchUrl}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 text-xs font-semibold text-blue-600 dark:text-blue-400 hover:underline">
            <span>Open on LeetCode</span>
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
          </a>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label for="drawer-dsa-lang" class="block text-[10px] font-mono uppercase text-slate-400 mb-1">Language</label>
              <select id="drawer-dsa-lang" onchange="persistDrawerInputs()" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-xs">
                <option value="TypeScript" ${prog.solutionLanguage === 'TypeScript' ? 'selected' : ''}>TypeScript</option>
                <option value="JavaScript" ${prog.solutionLanguage === 'JavaScript' ? 'selected' : ''}>JavaScript</option>
              </select>
            </div>
            <div>
              <label for="drawer-dsa-attempts" class="block text-[10px] font-mono uppercase text-slate-400 mb-1">Attempts</label>
              <input id="drawer-dsa-attempts" type="number" min="0" value="${prog.attempts || 0}" oninput="persistDrawerInputs()" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-xs font-mono" />
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label for="drawer-dsa-time" class="block text-[10px] font-mono uppercase text-slate-400 mb-1">Time Complexity</label>
              <input id="drawer-dsa-time" type="text" placeholder="e.g. O(n)" value="${escapeHtml(prog.timeComplexity || '')}" oninput="persistDrawerInputs()" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-xs font-mono" />
            </div>
            <div>
              <label for="drawer-dsa-space" class="block text-[10px] font-mono uppercase text-slate-400 mb-1">Space Complexity</label>
              <input id="drawer-dsa-space" type="text" placeholder="e.g. O(1)" value="${escapeHtml(prog.spaceComplexity || '')}" oninput="persistDrawerInputs()" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-xs font-mono" />
            </div>
          </div>

          <div>
            <div class="flex items-center justify-between mb-1">
              <label for="drawer-notes" class="text-[10px] font-mono uppercase text-slate-400">Pattern &amp; Solution Notes</label>
              <span class="text-[10px] text-slate-400">Auto-saved</span>
            </div>
            <textarea id="drawer-notes" rows="8" placeholder="Write intuition, edge cases, or optimal approach..." oninput="persistDrawerInputs()" class="w-full p-3 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-xs leading-relaxed focus:outline-none focus:ring-2 focus:ring-blue-500/30">${escapeHtml(prog.notes || '')}</textarea>
          </div>
        `;

        statusBtn.className = isSolved
          ? 'px-4 py-2 rounded-xl text-xs font-semibold bg-emerald-600 text-white hover:bg-emerald-700 transition-colors'
          : 'px-4 py-2 rounded-xl text-xs font-semibold bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-slate-100 hover:bg-slate-300 dark:hover:bg-slate-700 transition-colors';
        statusBtn.textContent = `Status: ${prog.status.toUpperCase()} (Click to cycle)`;
        statusBtn.onclick = () => cycleDsaStatus(id);
        return;
      }

      // Syllabus Item or Project
      let itemObj = null;
      let badgeText = '';
      if (kind === 'project') {
        itemObj = CURRICULUM_DATA.projects.find(p => p.id === id);
        if (itemObj) badgeText = `Project 0${itemObj.order} • ${itemObj.tierLabel}`;
      } else {
        for (const mod of CURRICULUM_DATA.syllabus) {
          const found = [...mod.practice, ...mod.interviewConcepts].find(i => i.id === id);
          if (found) {
            itemObj = found;
            badgeText = `Module 0${mod.order} • ${found.type === 'practice' ? 'Practice Task' : 'Interview Concept'}`;
            break;
          }
        }
      }
      if (!itemObj) return;
      const prog = getItemProgress(id);

      badgeEl.textContent = badgeText;
      titleEl.textContent = itemObj.title || itemObj.text;

      bodyEl.innerHTML = `
        ${itemObj.summary ? `<p class="text-xs sm:text-sm text-slate-600 dark:text-slate-300 leading-relaxed">${escapeHtml(itemObj.summary)}</p>` : ''}
        ${itemObj.tags ? `
          <div class="flex flex-wrap gap-1.5">
            ${itemObj.tags.map(t => `<span class="text-[11px] font-mono px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400">#${escapeHtml(t)}</span>`).join('')}
          </div>
        ` : ''}
        ${itemObj.skillsProven ? `
          <div class="flex flex-wrap gap-1.5">
            ${itemObj.skillsProven.map(s => `<span class="text-[11px] font-mono px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400">${escapeHtml(s)}</span>`).join('')}
          </div>
        ` : ''}

        <div>
          <div class="flex items-center justify-between mb-1">
            <label for="drawer-notes" class="text-[10px] font-mono uppercase text-slate-400">${kind === 'project' ? 'Repo URL & Architecture Notes' : 'Study Notes & Key Takeaways'}</label>
            <span class="text-[10px] text-slate-400">Auto-saved</span>
          </div>
          <textarea id="drawer-notes" rows="9" placeholder="Add code snippets, links, or interview takeaways..." oninput="persistDrawerInputs()" class="w-full p-3 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-xs leading-relaxed focus:outline-none focus:ring-2 focus:ring-blue-500/30">${escapeHtml(prog.notes || '')}</textarea>
        </div>

        ${prog.completedAt ? `<div class="text-[11px] font-mono text-slate-400">Completed on ${new Date(prog.completedAt).toLocaleDateString()}</div>` : ''}
      `;

      statusBtn.className = prog.completed
        ? 'px-4 py-2 rounded-xl text-xs font-semibold bg-emerald-600 text-white hover:bg-emerald-700 transition-colors'
        : 'px-4 py-2 rounded-xl text-xs font-semibold bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-slate-100 hover:bg-slate-300 dark:hover:bg-slate-700 transition-colors';
      statusBtn.textContent = prog.completed ? '✓ Completed' : 'Mark Completed';
      statusBtn.onclick = () => toggleItemCompletion(id);
    }

    function persistDrawerInputs() {
      if (!activeDrawer) return;
      const { kind, id } = activeDrawer;
      const notesEl = document.getElementById('drawer-notes');
      if (!notesEl) return;

      if (kind === 'dsa') {
        const cur = getDsaProgress(id);
        appState.dsaProblems[id] = {
          ...cur,
          solutionLanguage: document.getElementById('drawer-dsa-lang')?.value || cur.solutionLanguage,
          attempts: parseInt(document.getElementById('drawer-dsa-attempts')?.value, 10) || 0,
          timeComplexity: document.getElementById('drawer-dsa-time')?.value.trim() || '',
          spaceComplexity: document.getElementById('drawer-dsa-space')?.value.trim() || '',
          notes: notesEl.value
        };
      } else {
        const cur = getItemProgress(id);
        appState.items[id] = {
          ...cur,
          notes: notesEl.value
        };
      }
      saveState();
    }

    /**
     * ============================================================================
     * 7. MUTATIONS & FILTER ACTIONS
     * ============================================================================
     */
    function toggleItemCompletion(id) {
      const cur = getItemProgress(id);
      const next = !cur.completed;
      appState.items[id] = {
        ...cur,
        completed: next,
        completedAt: next ? new Date().toISOString() : null
      };
      saveState();
      renderCurrentView(false);
      if (activeDrawer && activeDrawer.id === id) {
        populateDrawerContent(activeDrawer.kind, id);
      }
      showToast(next ? 'Marked complete' : 'Marked incomplete', next ? 'success' : 'info');
    }

    function completeModuleBatch(modId) {
      const mod = CURRICULUM_DATA.syllabus.find(m => m.id === modId);
      if (!mod) return;
      const now = new Date().toISOString();
      for (const item of [...mod.practice, ...mod.interviewConcepts]) {
        const cur = getItemProgress(item.id);
        if (!cur.completed) {
          appState.items[item.id] = { ...cur, completed: true, completedAt: now };
        }
      }
      saveState();
      renderCurrentView(false);
      showToast(`Module 0${mod.order} completed!`, 'success');
    }

    function cycleDsaStatus(id) {
      const cur = getDsaProgress(id);
      const order = ['todo', 'in-progress', 'solved'];
      const nextStatus = order[(order.indexOf(cur.status) + 1) % order.length];

      appState.dsaProblems[id] = {
        ...cur,
        status: nextStatus,
        attempts: nextStatus !== 'todo' ? Math.max(1, (cur.attempts || 0) + (nextStatus === 'in-progress' ? 1 : 0)) : cur.attempts,
        completedAt: nextStatus === 'solved' ? new Date().toISOString() : null
      };
      saveState();
      renderCurrentView(false);
      if (activeDrawer && activeDrawer.id === id) {
        populateDrawerContent('dsa', id);
      }
      showToast({ 'todo': 'Status: Todo', 'in-progress': 'Status: Active', 'solved': 'Problem Solved!' }[nextStatus], nextStatus === 'solved' ? 'success' : 'info');
    }

    function setModuleFilter(modId) {
      appState.activeModuleFilter = modId;
      saveState();
      renderCurrentView(false);
    }

    function setTypeFilter(type) {
      appState.activeTypeFilter = type;
      saveState();
      renderCurrentView(false);
    }

    function jumpToModule(modId) {
      appState.activeModuleFilter = modId;
      switchView('modules');
    }

    function setProjectFilter(filter) {
      appState.activeProjectFilter = filter;
      saveState();
      renderCurrentView(false);
    }

    function setDsaCategory(catId) {
      appState.activeDsaCategory = catId;
      saveState();
      renderCurrentView(false);
    }

    function setDsaStatus(status) {
      appState.activeDsaStatus = status;
      saveState();
      renderCurrentView(false);
    }

    function toggleHideCompleted() {
      appState.hideCompleted = !appState.hideCompleted;
      updateHideCompletedBtn();
      saveState();
      renderCurrentView(false);
    }

    function clearGlobalSearch(shouldRender = true) {
      appState.searchQuery = '';
      const input = document.getElementById('global-search');
      if (input) input.value = '';
      if (shouldRender) renderCurrentView(false);
    }

    /**
     * ============================================================================
     * 8. BACKUP & RESTORE MODAL
     * ============================================================================
     */
    function openDataModal() {
      const modal = document.getElementById('data-modal-backdrop');
      if (!modal) return;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeDataModal() {
      const modal = document.getElementById('data-modal-backdrop');
      if (!modal) return;
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function exportProgressJson() {
      const payload = JSON.stringify({
        exportedAt: new Date().toISOString(),
        curriculumId: CURRICULUM_DATA.meta.id,
        items: appState.items,
        dsaProblems: appState.dsaProblems
      }, null, 2);

      const helper = document.createElement('textarea');
      helper.value = payload;
      helper.style.position = 'fixed';
      helper.style.opacity = '0';
      document.body.appendChild(helper);
      helper.select();
      try {
        document.execCommand('copy');
        showToast('Backup JSON copied to clipboard!', 'success');
      } catch (err) {
        showToast('Unable to copy automatically.', 'warning');
      }
      document.body.removeChild(helper);
    }

    function importProgressJson() {
      const input = document.getElementById('import-json-input');
      if (!input || !input.value.trim()) {
        showToast('Paste valid JSON before restoring.', 'warning');
        return;
      }
      try {
        const parsed = JSON.parse(input.value.trim());
        if (parsed.items && typeof parsed.items === 'object') appState.items = parsed.items;
        if (parsed.dsaProblems && typeof parsed.dsaProblems === 'object') appState.dsaProblems = parsed.dsaProblems;
        saveState();
        renderCurrentView(false);
        input.value = '';
        closeDataModal();
        showToast('Progress restored successfully!', 'success');
      } catch (err) {
        showToast('Invalid JSON format.', 'warning');
      }
    }

    /**
     * ============================================================================
     * 9. INITIALIZATION & EVENT LISTENERS
     * ============================================================================
     */
    window.addEventListener('DOMContentLoaded', () => {
      applyTheme(appState.theme);
      updateHideCompletedBtn();

      // Navigation buttons
      document.querySelectorAll('.nav-btn, .mobile-nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          clearGlobalSearch(false);
          switchView(btn.dataset.view, true);
        });
      });

      // Top bar controls
      document.getElementById('hide-completed-toggle').addEventListener('click', toggleHideCompleted);
      document.getElementById('theme-toggle').addEventListener('click', () => {
        applyTheme(appState.theme === 'dark' ? 'light' : 'dark');
      });

      // Search input (debounced)
      let searchTimer = null;
      const searchInput = document.getElementById('global-search');
      searchInput.addEventListener('input', (e) => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          appState.searchQuery = e.target.value;
          renderCurrentView(false);
        }, 120);
      });

      // Drawer close bindings (X button, Close button, Backdrop click)
      document.getElementById('drawer-close-x').addEventListener('click', closeDrawer);
      document.getElementById('drawer-done-btn').addEventListener('click', closeDrawer);
      document.getElementById('drawer-backdrop').addEventListener('click', closeDrawer);

      // Modal backdrop click to close
      document.getElementById('data-modal-backdrop').addEventListener('click', (e) => {
        if (e.target.id === 'data-modal-backdrop') closeDataModal();
      });

      // Keyboard shortcuts (Escape closes drawer/modal, / focuses search, 1-4 switch views)
      document.addEventListener('keydown', (e) => {
        const tag = document.activeElement?.tagName;
        const isTyping = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';

        if (e.key === 'Escape') {
          if (activeDrawer) {
            closeDrawer();
          } else if (!document.getElementById('data-modal-backdrop').classList.contains('hidden')) {
            closeDataModal();
          } else if (isTyping) {
            document.activeElement.blur();
          } else if (appState.searchQuery) {
            clearGlobalSearch();
          }
          return;
        }

        if (isTyping || activeDrawer) return;

        if (e.key === '/') {
          e.preventDefault();
          searchInput.focus();
        } else if (e.key === '1') switchView('overview', true);
        else if (e.key === '2') switchView('modules', true);
        else if (e.key === '3') switchView('projects', true);
        else if (e.key === '4') switchView('dsa', true);
      });

      updateGlobalTelemetry();
      switchView(appState.activeView, false);
    });
  </script>
</body>
</html>
